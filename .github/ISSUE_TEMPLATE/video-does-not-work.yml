name: A video doesn't work
description: The button is there, but summarizing that video fails.
labels: [transcript]
body:
  - type: markdown
    attributes:
      value: |
        YouTube restricts caption text, and this is the failure mode we most
        want to hear about. The video URL is the important part — caption
        behaviour varies per video and cannot be reproduced without it.
  - type: input
    id: url
    attributes:
      label: Video URL
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: What the panel said
      description: The exact text, including the heading above it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on the extension's card at chrome://extensions
  - type: textarea
    id: console
    attributes:
      label: Anything red in the console
      description: >
        Optional. chrome://extensions → the extension's card → Errors, and the
        service worker console. Please remove anything that looks like a key.
      render: text
